# RunPod Configuration for GRPO Training
# This file contains optimized settings for running on RunPod

runpod:
  # Environment settings
  environment: "community"  # or "secure"
  gpu_type: "NVIDIA RTX A100 40GB"  # Recommended: A100 40GB, A10G 24GB, or RTX 4090 24GB
  gpu_count: 1
  memory_gb: 64
  storage_gb: 100
  
  # Docker settings
  docker_image: "runpod/pytorch:2.6-py3.12-cuda-12.1"
  container_disk_size: 50
  
  # Network settings
  ports:
    - "8888:http"  # Jupyter
    - "22:tcp"     # SSH
    - "6006:tcp"   # TensorBoard
  
  # Environment variables
  env_vars:
    WANDB_PROJECT: "loki-runpod"
    CUDA_VISIBLE_DEVICES: "0"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
  
  # Auto-start settings
  auto_start: true
  ssh_enabled: true
  jupyter_enabled: true

# Training configuration optimized for RunPod
training:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 5e-6
  num_epochs: 3
  max_prompt_length: 256
  max_completion_length: 1024
  beta: 0.1
  
  # Memory optimization
  fp16: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  save_total_limit: 3
  
  # Data settings
  dataset_path: "data/hotpotqa.jsonl"
  num_samples: 100  # Increase for full training
  output_dir: "./outputs/grpo-training"

# Cost optimization
cost_optimization:
  # Auto-shutdown after training
  auto_shutdown: true
  shutdown_delay_minutes: 10
  
  # Spot instance settings (for cost savings)
  use_spot: false  # Set to true for significant cost savings
  spot_price_limit: 0.5  # Max price per hour
  
  # Monitoring
  cost_alert_threshold: 10.0  # Alert if cost exceeds $10
  max_runtime_hours: 24  # Kill job after 24 hours

