[project]
name = "loki"
version = "0.1.0"
description = "Loki: Adversarial steering and red-teaming for LLM steerability testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.56.2",
    "datasets>=4.1.1",
    "accelerate>=1.10.1",
    "torch>=2.1.0",
    "trl>=0.23.1",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "peft>=0.7.0",
    "jinja2>=3.1.6",
    "openai>=2.0.1",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]

[tool.uv]
dev-dependencies = []
