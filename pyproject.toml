[project]
name = "loki"
version = "0.1.0"
description = "Loki: Adversarial steering and red-teaming for LLM steerability testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.42.0",
    "datasets>=2.20.0",
    "accelerate>=0.33.0",
    "torch>=2.1.0",
    "trl>=0.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "peft>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]

[tool.uv]
dev-dependencies = []
