[project]
name = "loki"
version = "0.1.0"
description = "Loki: Adversarial steering and red-teaming for LLM steerability testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.6.*", # use cu124 wheels
  "transformers>=4.56.2",
  "trl>=0.23.1",
  "peft>=0.11.1,<1.0",
  "accelerate>=1.1.0,<2.0",
  "datasets>=4.1.1",
  "numpy>=1.24.0,<3.0",
  "scikit-learn>=1.3.0,<2.0",
  "jinja2>=3.1.6,<4.0",
  "openai>=2.0.1",
  "python-dotenv>=1.0.1,<2.0",
  "wandb>=0.22.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]

# optional, replace the deprecated dev-dependencies
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.10", "ipykernel>=6.29"]
